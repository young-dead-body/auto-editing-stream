name: Build desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller -r requirements-desktop.txt
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name KipofoxStudio --hidden-import faster_whisper --add-data "web;web" --add-data "transcribe_stream.py;." --add-data "highlights_to_fcp7xml.py;." --add-data "render_preview.py;." app.py
      - run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: KipofoxStudio-Windows-installer
          path: installer/*.exe
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller -r requirements-desktop.txt
      - run: pyinstaller --noconfirm --clean --onedir --windowed --name KipofoxStudio --hidden-import faster_whisper --add-data "web:web" --add-data "transcribe_stream.py:." --add-data "highlights_to_fcp7xml.py:." --add-data "render_preview.py:." app.py
      - run: hdiutil create -volname "Kipofox Studio" -srcfolder dist/KipofoxStudio.app -ov -format UDZO KipofoxStudio-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: KipofoxStudio-macOS-installer
          path: KipofoxStudio-macOS.dmg
