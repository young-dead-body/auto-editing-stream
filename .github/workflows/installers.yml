name: Build release files
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller -r requirements-desktop.txt
      - name: Download FFmpeg for the portable executable
        shell: pwsh
        run: |
          $sources = @(
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          )
          $ffmpegRoot = $null
          for ($source = 0; $source -lt $sources.Count -and -not $ffmpegRoot; $source++) {
            for ($attempt = 1; $attempt -le 2 -and -not $ffmpegRoot; $attempt++) {
              $archive = "ffmpeg-$source-$attempt.zip"
              $destination = "ffmpeg-$source-$attempt"
              try {
                Invoke-WebRequest $sources[$source] -OutFile $archive -ErrorAction Stop
                if ((Get-Item $archive).Length -lt 1000000) { throw 'FFmpeg archive is incomplete' }
                Expand-Archive $archive -DestinationPath $destination -ErrorAction Stop
                $ffmpegRoot = $destination
              } catch {
                Write-Warning "FFmpeg download attempt failed: $_"
                Start-Sleep -Seconds 5
              }
            }
          }
          if (-not $ffmpegRoot) { throw 'Could not download FFmpeg from either source' }
          New-Item -ItemType Directory -Path tools | Out-Null
          foreach ($name in @('ffmpeg.exe', 'ffprobe.exe')) {
            $binary = Get-ChildItem $ffmpegRoot -Recurse -Filter $name | Select-Object -First 1
            if (-not $binary) { throw "$name missing from FFmpeg archive" }
            Copy-Item $binary.FullName "tools/$name"
          }
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name StreamEditor --collect-all faster_whisper --collect-all ctranslate2 --hidden-import transcribe_stream --hidden-import highlights_to_fcp7xml --hidden-import render_preview --hidden-import analyze_highlights --hidden-import export_clips --hidden-import device_profile --hidden-import deep_analysis --hidden-import visual_analysis --add-binary "tools/ffmpeg.exe;." --add-binary "tools/ffprobe.exe;." --add-data "web;web" --add-data "transcribe_stream.py;." --add-data "highlights_to_fcp7xml.py;." --add-data "render_preview.py;." --add-data "analyze_highlights.py;." --add-data "export_clips.py;." --add-data "deep_analysis.py;." app.py
      - name: Check Windows executable serves the page
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\StreamEditor.exe -ArgumentList '--no-browser' -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              if ($process.HasExited) { throw "StreamEditor.exe exited with code $($process.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match '<html') {
                  $ready = $true
                  break
                }
              } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) { throw 'StreamEditor.exe did not serve the page within 90 seconds' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Check packaged XML export and transcription startup
        shell: pwsh
        run: |
          Write-Host 'Creating test video'
          & .\tools\ffmpeg.exe -nostdin -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x240:rate=25 -f lavfi -i sine=frequency=440 -t 3 -c:v mpeg4 -c:a aac -ac 2 test.mp4
          if ($LASTEXITCODE -ne 0) { throw 'Could not create test video' }
          Set-Content -Path highlights.csv -Value @('start,end', '00:00:00,00:00:01')
          $env:STREAM_EDITOR_DATA = Join-Path $PWD 'task-data'
          Write-Host 'Checking XML export'
          $xml = Start-Process -FilePath .\dist\StreamEditor.exe -ArgumentList @('--task', 'highlights_to_fcp7xml.py', 'test.mp4', 'highlights.csv', 'highlights.xml') -PassThru
          if (-not $xml.WaitForExit(120000)) {
            Stop-Process -Id $xml.Id -Force
            Get-Content task-data\job.log -ErrorAction SilentlyContinue
            throw 'Packaged XML export timed out'
          }
          if ($xml.ExitCode -ne 0 -or -not (Test-Path highlights.xml)) {
            Get-Content task-data\job.log -ErrorAction SilentlyContinue
            throw 'Packaged XML export failed'
          }
          Remove-Item task-data\job.log
          Write-Host 'Checking transcription startup'
          $transcribe = Start-Process -FilePath .\dist\StreamEditor.exe -ArgumentList @('--task', 'transcribe_stream.py', 'test.mp4', '--work-dir', 'task-data\transcript', '--audio-stream', '1') -PassThru
          if (-not $transcribe.WaitForExit(120000)) {
            Stop-Process -Id $transcribe.Id -Force
            Get-Content task-data\job.log -ErrorAction SilentlyContinue
            throw 'Packaged transcription startup timed out'
          }
          if ($transcribe.ExitCode -ne 2 -or -not ((Get-Content task-data\job.log -Raw) -match 'Audio stream 1 does not exist')) {
            Get-Content task-data\job.log -ErrorAction SilentlyContinue
            throw 'Packaged transcription startup failed'
          }
          Remove-Item task-data\job.log
          Write-Host 'Checking audio decoding and transcription with the tiny model'
          $transcribe = Start-Process -FilePath .\dist\StreamEditor.exe -ArgumentList @('--task', 'transcribe_stream.py', 'test.mp4', '--work-dir', 'task-data\transcript', '--model', 'tiny') -PassThru
          if (-not $transcribe.WaitForExit(600000)) {
            Stop-Process -Id $transcribe.Id -Force
            Get-Content task-data\job.log -ErrorAction SilentlyContinue
            throw 'Packaged transcription timed out'
          }
          if ($transcribe.ExitCode -ne 0 -or -not (Test-Path task-data\transcript\transcript_timestamps.json)) {
            Get-Content task-data\job.log -ErrorAction SilentlyContinue
            throw 'Packaged transcription failed'
          }
          Remove-Item task-data\job.log
          Write-Host 'Checking automatic highlight analysis'
          $analyze = Start-Process -FilePath .\dist\StreamEditor.exe -ArgumentList @('--task', 'analyze_highlights.py', 'test.mp4', 'task-data\transcript\transcript_timestamps.json', 'auto-highlights.csv') -PassThru
          if (-not $analyze.WaitForExit(120000)) { Stop-Process -Id $analyze.Id -Force; throw 'Packaged analysis timed out' }
          if ($analyze.ExitCode -ne 0 -or -not (Test-Path auto-highlights.csv)) {
            Get-Content task-data\job.log -ErrorAction SilentlyContinue
            throw 'Packaged analysis failed'
          }
          Remove-Item task-data\job.log
          Write-Host 'Checking standalone clip export'
          $clips = Start-Process -FilePath .\dist\StreamEditor.exe -ArgumentList @('--task', 'export_clips.py', 'test.mp4', 'highlights.csv', 'test-clips') -PassThru
          if (-not $clips.WaitForExit(120000)) { Stop-Process -Id $clips.Id -Force; throw 'Packaged clip export timed out' }
          if ($clips.ExitCode -ne 0 -or -not (Test-Path test-clips\clip_001.mp4)) {
            Get-Content task-data\job.log -ErrorAction SilentlyContinue
            throw 'Packaged clip export failed'
          }
      - name: Check Windows local vision model
        shell: pwsh
        run: |
          $env:PATH = "$(Join-Path $PWD 'tools');$env:PATH"
          python tests/visual_smoke.py
      - name: Save Windows task diagnostics
        if: failure() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $report = @('Windows packaged task diagnostics', "Tag: $env:GITHUB_REF_NAME")
          $report += 'Job log:'
          $report += Get-Content task-data\job.log -ErrorAction SilentlyContinue
          $report += 'Output files:'
          $report += Get-ChildItem -Path test.mp4, highlights.csv, highlights.xml, task-data -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          $report += 'Processes:'
          $report += Get-CimInstance Win32_Process -Filter "name='StreamEditor.exe' or name='ffprobe.exe'" | Select-Object ProcessId,CommandLine | Out-String
          $branch = "diagnostics/windows-$env:GITHUB_REF_NAME"
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout --orphan $branch
          git rm -r --cached . | Out-Null
          Set-Content -Path windows-diagnostics.txt -Value $report
          git add windows-diagnostics.txt
          git commit -m 'Record packaged Windows task failure'
          git push origin "HEAD:refs/heads/$branch"
      - uses: actions/upload-artifact@v4
        with:
          name: StreamEditor-Windows
          path: dist/StreamEditor.exe
          if-no-files-found: error
  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux container
        run: docker buildx build --platform linux/${{ matrix.arch }} --load --tag stream-editor:release .
      - name: Check container startup
        run: docker run --rm stream-editor:release python -c "import app; import faster_whisper"
      - name: Check Linux local vision model
        if: matrix.arch == 'amd64'
        run: docker run --rm -v "$PWD:/src:ro" -w /src stream-editor:release python tests/visual_smoke.py
      - name: Save container image
        shell: bash
        run: docker save stream-editor:release | gzip > StreamEditor-Linux-${{ matrix.arch }}.docker.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: StreamEditor-Linux-${{ matrix.arch }}
          path: StreamEditor-Linux-${{ matrix.arch }}.docker.tar.gz
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: brew install ffmpeg
      - run: python -m pip install -r requirements-desktop.txt
      - run: python -m unittest discover -s tests -q
      - name: Check macOS local vision model
        run: python tests/visual_smoke.py
  release:
    if: github.event_name != 'workflow_dispatch'
    needs: [windows, container, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-files/StreamEditor.exe release-files/StreamEditor-Linux-*.docker.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-files/StreamEditor.exe release-files/StreamEditor-Linux-*.docker.tar.gz --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
